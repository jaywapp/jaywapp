<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-labelledby="title desc">
  <title id="title">Marvelog — Your next Marvel watch, organized.</title>
  <desc id="desc">An original compact project cover for Marvelog, with an abstract film card. This is brand artwork, not a screenshot of the app.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#111e30"/>
      <stop offset="0.65" stop-color="#08111f"/>
      <stop offset="1" stop-color="#173034"/>
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7af4cc" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#76cae5" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="600" height="230" rx="18" fill="url(#background)"/>
  <rect x="0.75" y="0.75" width="598.5" height="228.5" rx="17.25" fill="none" stroke="#37505c" stroke-opacity="0.58" stroke-width="1.5"/>
  <rect x="0" y="44" width="4" height="142" rx="2" fill="#7af4cc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="30" y="95" font-size="64" font-weight="700" letter-spacing="-2.5" fill="#f4f7fc">Marvelog<tspan fill="#7af4cc">.</tspan></text>
    <text x="33" y="146" font-size="27" fill="#b0c1ce">Your next Marvel watch,</text>
    <text x="33" y="183" font-size="27" fill="#b0c1ce">organized.</text>
  </g>
  <g fill="none" stroke-width="1.5">
    <rect x="425" y="55" width="96" height="115" rx="8" stroke="#35515b" transform="rotate(-9 473 112)"/>
    <rect x="450" y="44" width="96" height="115" rx="8" fill="#10212c" stroke="#7af4cc"/>
    <rect x="461" y="56" width="74" height="75" rx="3" fill="url(#film)" stroke="#476e76"/>
    <path d="M490 78L510 94L490 110Z" fill="#7af4cc" stroke="none"/>
    <path d="M462 144H505" stroke="#7af4cc"/>
    <circle cx="529" cy="144" r="3" fill="#7af4cc" stroke="none"/>
  </g>
